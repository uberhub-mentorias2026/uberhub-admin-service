spring.application.name=admin-service
# Configuração de conexão com o banco (substitua admin_service_db pelo nome que você criou)
spring.datasource.url=jdbc:mysql://localhost:3306/admin_service_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do Hibernate (cria/atualiza as tabelas automaticamente baseado nas suas classes @Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true